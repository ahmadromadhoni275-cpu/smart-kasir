name: smart-kasir
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4 
  intl: ^0.18.0 # Untuk memformat angka mata uang Rupiah & Tanggal
  pdf: ^3.10.4  # Opsional untuk cetak PDF/Sharing jika printer LAN/Wi-Fi pakai driver web view
  printing: ^5.11.1 # Membuka dialog cetak bawaan sistem (Android & iOS) yang sangat responsif
  url_launcher: ^6.2.1
  print_bluetooth_thermal: ^1.1.8
  esc_pos_utils_plus: ^2.0.3
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo2.png
